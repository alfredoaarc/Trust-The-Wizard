<path d="M375 118 c-8 -6 -18 -7 -26 -3 c-11 6 -15 17 -12 29 c2 10 6 18 8 28 c2 10 3 21 7 30 c2 4 7 4 9 0 c4 -7 3 -17 6 -25 c1 -4 5 -7 8 -7 s7 3 8 7 c3 8 2 18 6 25 c2 4 7 4 9 0 c4 -9 5 -20 7 -30 c2 -10 6 -18 8 -28 c3 -12 -1 -23 -12 -29 c-8 -4 -18 -3 -26 3 Z" fill="#7fb3a5"/>
