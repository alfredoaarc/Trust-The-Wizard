<line x1="660" y1="345" x2="770" y2="345" stroke="#c8d4c9" stroke-width="4"/>
<line x1="660" y1="390" x2="770" y2="390" stroke="#c8d4c9" stroke-width="4"/>
<circle cx="748" cy="322" r="4" fill="#9fb3a4"/>
<circle cx="748" cy="367" r="4" fill="#9fb3a4"/>
