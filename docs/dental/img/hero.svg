<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#f2f6f1"/><stop offset="1" stop-color="#e6efe7"/>
</linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#dbe6dc"/><stop offset="1" stop-color="#c9d9cc"/>
</linearGradient>
<radialGradient id="lamp" cx="50%" cy="18%" r="55%">
<stop offset="0" stop-color="#fff6dd" stop-opacity="0.9"/><stop offset="1" stop-color="#fff6dd" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="800" height="600" fill="url(#wall)"/>
<rect y="400" width="800" height="200" fill="url(#floor)"/>
<!-- window -->
<rect x="60" y="70" width="220" height="190" rx="10" fill="#dceef3"/>
<rect x="60" y="70" width="220" height="190" rx="10" fill="none" stroke="#b9cbba" stroke-width="8"/>
<line x1="170" y1="70" x2="170" y2="260" stroke="#b9cbba" stroke-width="6"/>
<circle cx="230" cy="115" r="22" fill="#f2c66b" opacity="0.85"/>
